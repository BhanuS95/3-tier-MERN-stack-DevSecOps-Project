apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-statefulset
  namespace: webapp
spec:
  serviceName: "db-service"
  replicas: 1
  selector:
    matchLabels:
      app: database
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: mongodb:4.4.6
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mongodb/data
  
  volumeClaimTemplates:
    - metadata:
        name: db-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "ebs-sc"
        resources:
          requests:
            storage: 1Gi