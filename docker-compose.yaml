services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "3500:3500"
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mongo:4.4.6
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - db-data:/var/lib/mongodb
    networks:
      - app-network
    ports:
      - "27017:27017"

volumes:
  db-data:

networks:
  app-network: